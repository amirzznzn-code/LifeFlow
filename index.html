<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>منظّم الحياة</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#1e2235;--mu:#6b7189;--bd:#e5e7ef;--pr:#6366f1;--pr2:#8b5cf6;--bl:#3b82f6;--ok:#22c55e;--wa:#f97316;--er:#ef4444;--sh:0 4px 20px rgba(30,34,53,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1222;--card:#171c30;--tx:#e8eaf6;--mu:#8e94b0;--bd:#262c47;--sh:0 4px 20px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1222;--card:#171c30;--tx:#e8eaf6;--mu:#8e94b0;--bd:#262c47;--sh:0 4px 20px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Tajawal,Cairo,"Segoe UI",system-ui,-apple-system,Tahoma,sans-serif}
#app{display:flex;min-height:100vh}
nav{width:220px;padding:20px 14px;background:var(--card);border-inline-end:1px solid var(--bd);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:12px;color:var(--mu);transition:.2s;display:flex;gap:10px}
nav button:hover{background:var(--bg)}nav button.on{background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff}
main{flex:1;padding:24px;max-width:1100px;margin:auto;width:100%;animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
h1{margin:0 0 4px;font-size:26px}h2{font-size:17px;margin:0 0 12px}.mu{color:var(--mu);font-size:13px}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:16px 0}
.c{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--sh);border:1px solid var(--bd)}
.st b{font-size:28px;display:block}.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.row>.f{flex:1;min-width:0}
.btn{border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff;font:inherit;transition:.15s}.btn:hover{transform:translateY(-1px)}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--er)}.ic{background:none;border:0;cursor:pointer;font:inherit;font-size:12px;color:var(--pr);opacity:.85;padding:2px 6px}.ic:hover{opacity:1;text-decoration:underline}
input,select,textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--bl));transition:width .5s}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd)}.High{color:var(--er)}.Medium{color:var(--wa)}.Low{color:var(--ok)}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.bar2>*{width:auto;flex:0 1 auto}.bar2 input{flex:1 1 160px}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kb>div{background:var(--bg);border-radius:14px;padding:10px;min-height:120px}.kb .c{padding:10px;margin:8px 0;cursor:grab}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{min-height:58px;padding:4px;border-radius:10px;background:var(--bg);font-size:12px;cursor:pointer}.cal .t{outline:2px solid var(--pr)}.cal .h{min-height:0;text-align:center;cursor:default;color:var(--mu)}.dot{display:block;background:var(--pr);color:#fff;border-radius:5px;padding:0 4px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:10px}
dialog{border:0;border-radius:18px;padding:20px;width:min(440px,92vw);background:var(--card);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.4)}dialog::backdrop{background:rgba(0,0,0,.5)}dialog label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mu)}
.emp{text-align:center;color:var(--mu);padding:26px}#toast{position:fixed;bottom:80px;inset-inline-end:20px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}
.fab{position:fixed;bottom:20px;inset-inline-end:20px;padding:12px 18px;border-radius:99px;font-size:14px;box-shadow:var(--sh);z-index:5}
.ft{text-align:center;padding:16px 12px;color:var(--mu);font-size:13px;border-top:1px solid var(--bd)}
@media(max-width:800px){.ft{padding-bottom:90px}#app{flex-direction:column}nav{position:fixed;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;overflow-x:auto;z-index:4;padding:6px;border-top:1px solid var(--bd);border-inline-end:0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}nav button{flex-direction:column;align-items:center;font-size:10px;gap:0;padding:6px 10px;white-space:nowrap}main{padding:16px 14px 100px}.kb{grid-template-columns:1fr}.fab{bottom:84px}}
</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div><footer class="ft" dir="ltr">This website was created by Eng. Amir Mohamed</footer><div id="toast"></div><dialog id="dlg"></dialog><button class="btn fab" onclick="quick()">إضافة سريعة</button>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const def=()=>({name:'صديقي',theme:'auto',cur:'EGP',tasks:[],goals:[],events:[],tx:[],habits:[],notes:[],budgets:{},dis:[],lists:[],sav:[],health:{},focus:{},acc:0,fz:1,pin:'',ob:0});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem('lf_ar')))}catch(e){S=def()}
const save=()=>{try{localStorage.setItem('lf_ar',JSON.stringify(S))}catch(e){}};
const D=d=>{d=d||new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},today=()=>D();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=['للتنفيذ','قيد التنفيذ','مكتملة'],DONE='مكتملة',PR=['منخفضة','متوسطة','عالية'],PC={'منخفضة':'Low','متوسطة':'Medium','عالية':'High'};
const CATS=['طعام','تسوق','مواصلات','فواتير','ترفيه','صحة','تعليم','أخرى'];
const NAV=[['dash','','الرئيسية'],['tasks','','المهام'],['goals','','الأهداف'],['cal','','التقويم'],['money','','المصروفات'],['sav','','المدخرات'],['habits','','العادات'],['health','','الصحة والمزاج'],['focus','','مؤقت التركيز'],['lists','','القوائم'],['notes','','الملاحظات'],['stats','','الإنجازات'],['notif','','الإشعارات'],['search','','البحث'],['set','','الإعدادات']];
let V='dash',tv='list',q='',fs='',fp='',nf='',cv='m',wo=0,cm=new Date();
const T=k=>NAV.find(n=>n[0]==k)[2];
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2000)}
function theme(){const r=document.documentElement;S.theme=='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.theme;const A=ACC[S.acc||0];r.style.setProperty('--pr',A[1]);r.style.setProperty('--pr2',A[2]);document.body.style.fontSize=[14,15,17][S.fz??1]+'px'}
function go(v){V=v;q='';render()}
function form(title,F,v,cb){v=v||{};$('#dlg').innerHTML=`<form method="dialog" onsubmit="return false"><h2>${title}</h2>${F.map(f=>`<label>${f.l}</label>${f.t=='textarea'?`<textarea name="${f.k}" rows="3">${esc(v[f.k])}</textarea>`:f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option ${o==v[f.k]?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(v[f.k]??f.d??'')}" ${f.r?'required':''} ${f.t=='number'?'step="any" min="0"':''}>`}`).join('')}<div class="bar2" style="justify-content:flex-start;margin-top:16px"><button class="btn">حفظ</button><button type="button" class="btn s" onclick="$('#dlg').close()">إلغاء</button></div></form>`;
 const fm=$('#dlg form');fm.onsubmit=e=>{e.preventDefault();if(!fm.reportValidity())return;const o={};F.forEach(f=>o[f.k]=fm.elements[f.k].value);cb(o);save();$('#dlg').close();toast('تم الحفظ');render()};$('#dlg').showModal()}
const del=(a,id,lbl)=>{$('#dlg').innerHTML=`<h2>تأكيد الحذف</h2><p>هل تريد حذف ${lbl}؟</p><div class="bar2"><button class="btn d" id="yes">حذف</button><button class="btn s" onclick="$('#dlg').close()">إلغاء</button></div>`;$('#yes').onclick=()=>{S[a]=S[a].filter(x=>x.id!=id);save();$('#dlg').close();render();toast('تم الحذف')};$('#dlg').showModal()};
const empty=m=>`<div class="emp"> ${m}</div>`;
const money=n=>new Intl.NumberFormat('ar-EG',{style:'currency',currency:S.cur,maximumFractionDigits:0}).format(n);
const TF=[{k:'title',l:'العنوان',r:1},{k:'desc',l:'الوصف',t:'textarea'},{k:'pri',l:'الأولوية',t:'select',o:PR},{k:'status',l:'الحالة',t:'select',o:ST},{k:'cat',l:'التصنيف / الوسوم'},{k:'due',l:'تاريخ الاستحقاق',t:'date'}];
function taskF(id,due){const t=S.tasks.find(x=>x.id==id);form(t?'تعديل المهمة':'مهمة جديدة',TF,t||{pri:'متوسطة',status:ST[0],due:due||''},o=>{if(t)Object.assign(t,o);else S.tasks.push({id:uid(),...o});const x=t||S.tasks[S.tasks.length-1];x.doneAt=x.status==DONE?(x.doneAt||today()):null})}
function evF(id,date){const e=S.events.find(x=>x.id==id);form(e?'تعديل الحدث':'حدث جديد',[{k:'title',l:'العنوان',r:1},{k:'date',l:'التاريخ',t:'date',r:1},{k:'time',l:'الوقت',t:'time'},{k:'cat',l:'التصنيف',t:'select',o:['شخصي','عمل','صحة','اجتماعي']},{k:'desc',l:'الوصف',t:'textarea'}],e||{date:date||today(),cat:'شخصي'},o=>e?Object.assign(e,o):S.events.push({id:uid(),...o}))}
function txF(id){const e=S.tx.find(x=>x.id==id);form(e?'تعديل المعاملة':'إضافة معاملة',[{k:'type',l:'النوع',t:'select',o:['مصروف','دخل']},{k:'amt',l:'المبلغ ('+S.cur+')',t:'number',r:1},{k:'cat',l:'التصنيف',t:'select',o:CATS.concat('راتب')},{k:'date',l:'التاريخ',t:'date',r:1},{k:'note',l:'ملاحظات'}],e||{type:'مصروف',date:today(),cat:'طعام'},o=>{o.amt=+o.amt;e?Object.assign(e,o):S.tx.push({id:uid(),...o})})}
function goalF(id){const g=S.goals.find(x=>x.id==id);form(g?'تعديل الهدف':'هدف جديد',[{k:'title',l:'العنوان',r:1},{k:'desc',l:'الوصف',t:'textarea'},{k:'type',l:'النوع',t:'select',o:['شخصي','مهني']},{k:'due',l:'الموعد النهائي',t:'date'},{k:'ms',l:'المراحل (كل مرحلة في سطر)',t:'textarea'},{k:'p',l:'نسبة الإنجاز اليدوية % (لو مفيش مراحل)',t:'number'}],g?{...g,ms:g.ms.map(m=>m.t).join('\n')}:{type:'شخصي',p:0},o=>{const old=g?g.ms:[];o.ms=o.ms.split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({t,d:!!old.find(m=>m.t==t&&m.d)}));o.p=Math.min(100,+o.p||0);g?Object.assign(g,o):S.goals.push({id:uid(),...o})})}
function habF(id){const h=S.habits.find(x=>x.id==id);form(h?'تعديل العادة':'عادة جديدة',[{k:'name',l:'العادة',r:1},{k:'freq',l:'الجدول',t:'select',o:['يومي','أسبوعي']}],h||{freq:'يومي'},o=>h?Object.assign(h,o):S.habits.push({id:uid(),days:{},...o}))}
function noteF(id,pre){const n=S.notes.find(x=>x.id==id);form(n?'تعديل الملاحظة':'ملاحظة جديدة',[{k:'title',l:'العنوان',r:1},{k:'folder',l:'المجلد'},{k:'tags',l:'الوسوم'},{k:'body',l:'المحتوى',t:'textarea'}],n||pre||{},o=>n?Object.assign(n,o):S.notes.push({id:uid(),pin:0,date:today(),...o}))}
function quick(){form('إضافة سريعة',[{k:'w',l:'ماذا تريد أن تضيف؟',t:'select',o:['مهمة','حدث','مصروف','ملاحظة']}],{},o=>{setTimeout(()=>({'مهمة':taskF,'حدث':evF,'مصروف':txF,'ملاحظة':noteF})[o.w](),50)})}
const pct=g=>g.ms.length?Math.round(g.ms.filter(m=>m.d).length/g.ms.length*100):g.p||0;
const streak=h=>{let n=0,d=new Date();if(!h.days[D(d)])d.setDate(d.getDate()-1);while(h.days[D(d)]){n++;d.setDate(d.getDate()-1)}return n};
const mTx=()=>S.tx.filter(t=>t.date.slice(0,7)==today().slice(0,7));
const sp=c=>mTx().filter(x=>x.type=='مصروف'&&x.cat==c).reduce((p,x)=>p+x.amt,0);
function alerts(){const a=[],t=today(),n3=D(new Date(Date.now()+3*864e5));
 S.tasks.forEach(k=>{if(k.status!=DONE&&k.due){if(k.due<t)a.push(['','مهمة متأخرة: '+k.title,'o'+k.id]);else if(k.due<=n3)a.push(['','موعدها قريب: '+k.title,'d'+k.id])}});
 S.events.forEach(e=>{if(e.date>=t&&e.date<=n3)a.push(['','حدث قادم: '+e.title+' ('+e.date+')','e'+e.id])});
 S.habits.forEach(h=>{if(!h.days[t])a.push(['','تذكير بالعادة: '+h.name,'h'+h.id+t])});
 CATS.forEach(c=>{const b=S.budgets[c],s=sp(c);if(b&&s>b)a.push(['','تجاوزت ميزانية '+c+': '+money(s)+' من '+money(b),'b'+c+t.slice(0,7)])});
 S.goals.forEach(g=>g.ms.forEach(m=>{if(m.d)a.push(['','تم إنجاز مرحلة: '+m.t,'m'+g.id+m.t])}));
 return a.filter(x=>!S.dis.includes(x[2]))}
const V_={
dash(){const t=S.tasks,dn=t.filter(x=>x.status==DONE).length,hs=S.habits.length?Math.round(S.habits.filter(h=>h.days[today()]).length/S.habits.length*100):0,score=t.length?Math.round((dn/t.length*70)+(hs*.3)):hs;
 const ex=mTx().filter(x=>x.type=='مصروف').reduce((p,x)=>p+x.amt,0),up=S.events.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
 const days=[...Array(7)].map((_,i)=>{const d=D(new Date(Date.now()-(6-i)*864e5));return[d.slice(5),t.filter(x=>x.doneAt==d).length]}),mx=Math.max(1,...days.map(d=>d[1]));
 const gp=S.goals.length?Math.round(S.goals.reduce((p,g)=>p+pct(g),0)/S.goals.length):0,h=new Date().getHours();
 return`<h1>${h<12?'صباح الخير':'مساء الخير'}، ${esc(S.name)} </h1><div class="mu">${new Date().toLocaleString('ar-EG',{dateStyle:'full',timeStyle:'short'})}</div>
<div class="c" style="margin-top:12px"><span class="mu">اقتباس اليوم</span><div style="font-size:16px;font-weight:600">${QT[Math.floor(Date.now()/864e5)%QT.length]}</div></div><div class="bar2" style="margin-top:14px"><button class="btn s" onclick="taskF()">مهمة جديدة</button><button class="btn s" onclick="evF()">حدث جديد</button><button class="btn s" onclick="txF()">مصروف جديد</button><button class="btn s" onclick="noteF()">ملاحظة جديدة</button></div>
<div class="g"><div class="c st"><span class="mu">درجة الإنتاجية</span><b>${score}%</b><div class="bar"><i style="width:${score}%"></i></div></div><div class="c st"><span class="mu">إجمالي المهام</span><b>${t.length}</b></div><div class="c st"><span class="mu">المكتملة</span><b style="color:var(--ok)">${dn}</b></div><div class="c st"><span class="mu">المعلّقة</span><b style="color:var(--wa)">${t.length-dn}</b></div><div class="c st"><span class="mu">دقائق التركيز اليوم</span><b>${S.focus[today()]||0}</b></div><div class="c st"><span class="mu">أكواب المياه اليوم</span><b>${(S.health[today()]||{}).water||0} / 8</b></div><div class="c st"><span class="mu">إجمالي المدخرات</span><b>${money(S.sav.reduce((p,x)=>p+x.saved,0))}</b></div><div class="c st"><span class="mu">مصروفات الشهر</span><b>${money(ex)}</b></div><div class="c st"><span class="mu">تقدّم الأهداف</span><b>${gp}%</b><div class="bar"><i style="width:${gp}%"></i></div></div></div>
<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="c"><h2>الإنتاجية الأسبوعية</h2><svg viewBox="0 0 280 120" width="100%">${days.map((d,i)=>`<rect x="${i*40+8}" y="${100-d[1]/mx*85}" width="26" height="${d[1]/mx*85}" rx="6" fill="var(--pr)"/><text x="${i*40+21}" y="115" font-size="9" text-anchor="middle" fill="var(--mu)">${d[0]}</text><text x="${i*40+21}" y="${95-d[1]/mx*85}" font-size="10" text-anchor="middle" fill="var(--tx)">${d[1]||''}</text>`).join('')}</svg></div>
<div class="c"><h2>الأحداث القادمة</h2>${up.map(e=>`<div class="row"><div class="f">${esc(e.title)}</div><span class="mu">${e.date} ${e.time||''}</span></div>`).join('')||empty('لا توجد أحداث قادمة')}</div>
<div class="c"><h2>عادات اليوم (${hs}%)</h2>${S.habits.map(h=>`<label class="row"><input type="checkbox" style="width:auto" ${h.days[today()]?'checked':''} onchange="hab('${h.id}','${today()}')"><span class="f">${esc(h.name)}</span><span class="mu">${streak(h)} يوم</span></label>`).join('')||empty('أضف عادة للبدء')}</div></div>`},
tasks(){let L=S.tasks.filter(x=>(!fs||x.status==fs)&&(!fp||x.pri==fp)&&(x.title+x.cat+x.desc).toLowerCase().includes(q.toLowerCase()));L.sort((a,b)=>PR.indexOf(b.pri)-PR.indexOf(a.pri)||(a.due||'9').localeCompare(b.due||'9'));
 const item=x=>`<div class="row"><input type="checkbox" style="width:auto" ${x.status==DONE?'checked':''} onchange="tog('${x.id}')"><div class="f"><b style="${x.status==DONE?'text-decoration:line-through;opacity:.6':''}">${esc(x.title)}</b><div class="mu">${esc(x.cat||'')} ${x.due?'الاستحقاق: '+x.due:''} ${x.due&&x.due<today()&&x.status!=DONE?'<span class="High">متأخرة</span>':''}</div></div><span class="tag ${PC[x.pri]}">${x.pri}</span><button class="ic" onclick="taskF('${x.id}')">تعديل</button><button class="ic" onclick="del('tasks','${x.id}','هذه المهمة')">حذف</button></div>`;
 return`<h1>المهام</h1><div class="bar2"><input placeholder="بحث…" value="${esc(q)}" oninput="q=this.value;render(1)"><select onchange="fs=this.value;render()"><option value="">كل الحالات</option>${ST.map(s=>`<option ${s==fs?'selected':''}>${s}</option>`).join('')}</select><select onchange="fp=this.value;render()"><option value="">كل الأولويات</option>${PR.map(s=>`<option ${s==fp?'selected':''}>${s}</option>`).join('')}</select><button class="btn s" onclick="tv=tv=='list'?'kb':'list';render()">${tv=='list'?'عرض كانبان':'عرض قائمة'}</button><button class="btn" onclick="taskF()">مهمة جديدة</button></div>
 ${tv=='list'?`<div class="c">${L.map(item).join('')||empty('لا توجد مهام بعد — أضف أول مهمة!')}</div>`:`<div class="kb">${ST.map(s=>`<div ondragover="event.preventDefault()" ondrop="mv(event,'${s}')"><b>${s}</b>${L.filter(x=>x.status==s).map(x=>`<div class="c" draggable="true" ondragstart="event.dataTransfer.setData('t','${x.id}')"><b>${esc(x.title)}</b><div class="mu">${x.due||''} <span class="${PC[x.pri]}">${x.pri}</span></div><button class="ic" onclick="taskF('${x.id}')">تعديل</button><button class="ic" onclick="del('tasks','${x.id}','هذه المهمة')">حذف</button></div>`).join('')}</div>`).join('')}</div>`}`},
goals(){const od=g=>g.due&&g.due<today()&&pct(g)<100,dn=S.goals.filter(g=>pct(g)==100).length;

lists(){return`<h1>القوائم</h1><div class="bar2"><button class="btn" onclick="listF()">قائمة جديدة</button></div><div class="g">${S.lists.map(l=>`<div class="c"><div class="row" style="border:0"><b class="f">${esc(l.title)}</b><button class="ic" onclick="del('lists','${l.id}','هذه القائمة')">حذف</button></div>${l.items.map((it,i)=>`<div class="row"><input type="checkbox" style="width:auto" ${it.d?'checked':''} onchange="li('${l.id}',${i})"><span class="f" style="${it.d?'text-decoration:line-through;opacity:.6':''}">${esc(it.t)}</span><button class="ic" onclick="lr('${l.id}',${i})">إزالة</button></div>`).join('')}<div class="bar2"><input id="n${l.id}" placeholder="عنصر جديد" onkeydown="if(event.key=='Enter')la('${l.id}')"><button class="btn s" onclick="la('${l.id}')">إضافة</button></div></div>`).join('')||`<div class="c" style="grid-column:1/-1">${empty('اعمل قائمة تسوق أو أي قائمة تحتاجها')}</div>`}</div>`},
health(){const h=hget(),M=['سيئ','عادي','جيد','ممتاز'],last=[...Array(7)].map((_,i)=>{const d=D(new Date(Date.now()-(6-i)*864e5));return[d,S.health[d]||{}]});
return`<h1>الصحة والمزاج</h1><div class="g"><div class="c"><h2>المياه</h2><b style="font-size:30px">${h.water||0} / 8 أكواب</b><div class="bar"><i style="width:${Math.min(100,(h.water||0)/8*100)}%"></i></div><div class="bar2"><button class="btn" onclick="hv('water',1)">شربت كوب</button><button class="btn s" onclick="hv('water',-1)">تراجع</button></div></div><div class="c"><h2>النوم</h2><label class="mu">ساعات النوم الليلة الماضية</label><input type="number" min="0" max="24" step="0.5" value="${h.sleep||''}" onchange="hs('sleep',this.value)"></div><div class="c"><h2>المزاج اليوم</h2><div class="bar2">${M.map(m=>`<button class="btn ${h.mood==m?'':'s'}" onclick="hs('mood','${m}')">${m}</button>`).join('')}</div></div></div><div class="c"><h2>آخر 7 أيام</h2>${last.map(([d,x])=>`<div class="row"><span class="f">${d}</span><span class="mu">مياه: ${x.water||0}</span><span class="mu">نوم: ${x.sleep||'-'}</span><span class="tag">${x.mood||'-'}</span></div>`).join('')}</div>`},
sav(){return`<h1>المدخرات</h1><div class="bar2"><button class="btn" onclick="savF()">هدف ادخار جديد</button></div><div class="g">${S.sav.map(s=>{const p=Math.min(100,Math.round(s.saved/s.target*100));return`<div class="c"><div class="row" style="border:0"><b class="f">${esc(s.title)}</b><button class="ic" onclick="del('sav','${s.id}','هذا الهدف')">حذف</button></div><div class="mu">${money(s.saved)} من ${money(s.target)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="mu">${p}%${p>=100?' - تم تحقيق الهدف':''}</div><div class="bar2"><button class="btn s" onclick="dep('${s.id}')">إضافة مبلغ</button></div></div>`}).join('')||`<div class="c" style="grid-column:1/-1">${empty('ابدأ بهدف ادخار')}</div>`}</div>`},
stats(){const dn=S.tasks.filter(x=>x.status==DONE).length,bs=Math.max(0,...S.habits.map(streak)),ft=Object.values(S.focus).reduce((a,b)=>a+b,0);
const B=[['أول مهمة مكتملة',dn>=1],['10 مهام مكتملة',dn>=10],['50 مهمة مكتملة',dn>=50],['سلسلة عادة 7 أيام',bs>=7],['هدف مكتمل',S.goals.some(g=>pct(g)==100)],['ساعة تركيز',ft>=60],['5 ملاحظات',S.notes.length>=5],['أول مدخرات',S.sav.some(s=>s.saved>0)]];
const mo=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));const k=D(d).slice(0,7),f=t=>S.tx.filter(x=>x.date.slice(0,7)==k&&x.type==t).reduce((p,x)=>p+x.amt,0);return[k.slice(2),f('مصروف'),f('دخل')]}),mx=Math.max(1,...mo.map(m=>Math.max(m[1],m[2])));
return`<h1>الإنجازات والإحصائيات</h1><div class="g"><div class="c st"><span class="mu">مهام مكتملة</span><b>${dn}</b></div><div class="c st"><span class="mu">أطول سلسلة عادات</span><b>${bs} يوم</b></div><div class="c st"><span class="mu">إجمالي دقائق التركيز</span><b>${ft}</b></div><div class="c st"><span class="mu">عدد الملاحظات</span><b>${S.notes.length}</b></div></div><div class="c"><h2>الدخل والمصروفات (آخر 6 شهور)</h2><svg viewBox="0 0 300 130" width="100%">${mo.map((m,i)=>`<rect x="${i*48+8}" y="${105-m[2]/mx*90}" width="16" height="${m[2]/mx*90}" rx="4" fill="var(--ok)"/><rect x="${i*48+26}" y="${105-m[1]/mx*90}" width="16" height="${m[1]/mx*90}" rx="4" fill="var(--er)"/><text x="${i*48+26}" y="122" font-size="9" text-anchor="middle" fill="var(--mu)">${m[0]}</text>`).join('')}</svg><p class="mu">الأخضر دخل · الأحمر مصروفات</p></div><div class="c" style="margin-top:16px"><h2>الأوسمة</h2><div class="g">${B.map(b=>`<div class="c" style="${b[1]?'border-color:var(--ok)':'opacity:.5'}"><b>${b[0]}</b><div class="mu">${b[1]?'تم الحصول عليه':'لم يتحقق بعد'}</div></div>`).join('')}</div></div>`},
search(){const k=q.trim().toLowerCase(),r=[],has=(...a)=>a.join(' ').toLowerCase().includes(k);
if(k){S.tasks.forEach(x=>has(x.title,x.desc,x.cat)&&r.push(['مهمة',x.title,'tasks']));S.goals.forEach(x=>has(x.title,x.desc)&&r.push(['هدف',x.title,'goals']));S.events.forEach(x=>has(x.title,x.desc)&&r.push(['حدث',x.title,'cal']));S.notes.forEach(x=>has(x.title,x.body,x.tags)&&r.push(['ملاحظة',x.title,'notes']));S.habits.forEach(x=>has(x.name)&&r.push(['عادة',x.name,'habits']));S.lists.forEach(x=>has(x.title,x.items.map(i=>i.t).join(' '))&&r.push(['قائمة',x.title,'lists']));S.tx.forEach(x=>has(x.cat,x.note)&&r.push(['معاملة',x.cat+' - '+money(x.amt),'money']))}
return`<h1>البحث الشامل</h1><div class="bar2"><input placeholder="ابحث في كل بياناتك" value="${esc(q)}" oninput="q=this.value;render(1)"></div><div class="c">${r.map(x=>`<div class="row"><span class="tag">${x[0]}</span><span class="f">${esc(x[1])}</span><button class="ic" onclick="go('${x[2]}')">فتح</button></div>`).join('')||empty(k?'لا توجد نتائج':'اكتب كلمة للبحث')}</div>`}
});

function tog(id){const t=S.tasks.find(x=>x.id==id);t.status=t.status==DONE?ST[0]:DONE;t.doneAt=t.status==DONE?today():null;save();render()}
function mv(e,s){e.preventDefault();const t=S.tasks.find(x=>x.id==e.dataTransfer.getData('t'));if(t){t.status=s;t.doneAt=s==DONE?today():null;save();render()}}
function ms(id,i){const g=S.goals.find(x=>x.id==id);g.ms[i].d=!g.ms[i].d;save();render()}
function hab(id,d){const h=S.habits.find(x=>x.id==id);h.days[d]?delete h.days[d]:h.days[d]=1;save();render()}
function pin(id){const n=S.notes.find(x=>x.id==id);n.pin=n.pin?0:1;save();render()}


function render(keep){const f=document.activeElement,pos=f&&f.selectionStart;
 $('#nav').innerHTML=NAV.map(n=>`<button class="${V==n[0]?'on':''}" onclick="go('${n[0]}')">${n[2]}${n[0]=='notif'&&alerts().length?` (${alerts().length})`:''}</button>`).join('');
 $('#main').innerHTML=V_[V]();if(keep&&f&&f.placeholder){const i=$('#main input[placeholder]');i.focus();i.setSelectionRange(pos,pos)}}
theme();render();lockUI();onb();
</script></body></html>
